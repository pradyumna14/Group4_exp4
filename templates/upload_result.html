{% extends "base.html" %}

{% block title %}Upload Result{% endblock %}

{% block nav %}
  <a class="btn btn--secondary" href="{{ url_for('admin_dashboard') }}">Back</a>
{% endblock %}

{% block content %}
<div class="card">
  <h2>Upload Result</h2>

  {% if subjects %}
  <form action="/upload_result" method="POST" class="form">
    <div class="form-group">
      <label for="student_id">Student ID</label>
      <input id="student_id" class="form-control" type="number" name="student_id" placeholder="Student ID" required />
    </div>

    <div class="form-group">
      <label for="subject_id">Subject</label>
      <select id="subject_id" class="form-control" name="subject_id" required>
        <option value="">-- Select Subject --</option>
        {% for subject in subjects %}
        <option value="{{ subject[0] }}">{{ subject[1] }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="marks">Marks</label>
      <input id="marks" class="form-control" type="number" name="marks" min="0" max="100" placeholder="Marks (0-100)" required />
    </div>

    <div class="form-group">
      <label for="grade">Grade</label>
      <select id="grade" class="form-control" name="grade" required>
        <option value="">-- Select Grade --</option>
        <option value="A+">A+</option>
        <option value="A">A</option>
        <option value="B+">B+</option>
        <option value="B">B</option>
        <option value="C+">C+</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="F">F</option>
      </select>
    </div>

    <button class="btn" type="submit">Upload</button>
  </form>
  {% else %}
  <p class="page-alert"><strong>No subjects available.</strong> Please add subjects first before uploading results.</p>
  <a class="btn" href="{{ url_for('manage_subjects') }}">Add Subjects</a>
  {% endif %}
</div>
{% endblock %}
