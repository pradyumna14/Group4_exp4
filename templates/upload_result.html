{% extends "base.html" %}

{% block title %}Upload Result{% endblock %}

{% block nav %}
  <a class="btn btn--secondary" href="{{ url_for('admin_dashboard') }}">Back</a>
{% endblock %}

{% block content %}
<div class="card">
  <h2>Upload Result</h2>

  <form action="/upload_result" method="POST" class="form">
    <div class="form-group">
      <label for="student_id">Student ID</label>
      <input id="student_id" class="form-control" type="text" name="student_id" placeholder="Student ID" required />
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <input id="subject" class="form-control" type="text" name="subject" placeholder="Subject" required />
    </div>

    <div class="form-group">
      <label for="marks">Marks</label>
      <input id="marks" class="form-control" type="number" name="marks" placeholder="Marks" required />
    </div>

    <div class="form-group">
      <label for="grade">Grade</label>
      <input id="grade" class="form-control" type="text" name="grade" placeholder="Grade" required />
    </div>

    <button class="btn" type="submit">Upload</button>
  </form>
</div>
{% endblock %}
