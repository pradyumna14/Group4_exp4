{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block nav %}
  <a class="btn btn--secondary" href="{{ url_for('admin_dashboard') }}">Back</a>
{% endblock %}

{% block content %}
<div class="card">
  <h2>Add Student</h2>

  <form action="/add_student" method="POST" class="form">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" class="form-control" type="text" name="name" placeholder="Full name" required />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" class="form-control" type="email" name="email" placeholder="Email address" required />
    </div>

    <div class="form-group">
      <label for="mobile">Mobile</label>
      <input id="mobile" class="form-control" type="tel" name="mobile" placeholder="Phone number" required />
    </div>

    <div class="form-group">
      <label for="course">Course</label>
      <input id="course" class="form-control" type="text" name="course" placeholder="Course name" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" class="form-control" type="password" name="password" placeholder="Set a password" required />
    </div>

    <button class="btn" type="submit">Add Student</button>
  </form>
</div>
{% endblock %}
