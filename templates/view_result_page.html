{% extends "base.html" %}

{% block title %}View Result{% endblock %}

{% block nav %}
  <a class="btn btn--secondary" href="{{ url_for('admin_dashboard') }}">Back</a>
{% endblock %}

{% block content %}
<div class="card">
  <h2>View Student Result</h2>

  <form action="/view_result" method="POST" class="form">
    <div class="form-group">
      <label for="student_id">Student ID</label>
      <input id="student_id" class="form-control" type="number" name="student_id" placeholder="Enter student ID" required />
    </div>

    <button class="btn" type="submit">View Result</button>
  </form>
</div>
{% endblock %}
