{% extends "base.html" %}

{% block title %}Student Login{% endblock %}

{% block content %}
<div class="card">
  <h2>Student Login</h2>

  <form action="/student_login" method="POST" class="form">
    <div class="form-group">
      <label for="student_id">Student ID</label>
      <input id="student_id" class="form-control" type="text" name="student_id" placeholder="Enter your student ID" required />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" class="form-control" type="password" name="password" placeholder="Enter your password" required />
    </div>

    <button class="btn" type="submit">Login</button>
  </form>

  <p class="page-alert">
    Want to manage students? <a href="/admin">Admin Login</a>
  </p>
</div>
{% endblock %}
